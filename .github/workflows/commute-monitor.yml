name: Morning commute traffic monitor

on:
  schedule:
    - cron: "55 5 * * 1-5"
      timezone: "Europe/Madrid"
    - cron: "5 6 * * 1-5"
      timezone: "Europe/Madrid"
    - cron: "15 6 * * 1-5"
      timezone: "Europe/Madrid"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Modo de ejecución"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - morning
      regenerate_route:
        description: "Regenerar la ruta fija usando el waypoint correcto"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: morning-commute-traffic
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "465"
      SMTP_USERNAME: javier.garrido.pino@gmail.com
      SMTP_FROM: javier.garrido.pino@gmail.com
      EMAIL_TO: javier.garrido.pino@gmail.com
      SMTP_STARTTLS: "false"
      DRY_RUN: "false"
      TIMEZONE: Europe/Madrid

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Prepare application
        shell: bash
        run: |
          set -euo pipefail
          MAIN_FILE="$(find . -type f -path '*/commute_monitor/__main__.py' -not -path './.runtime_app/*' -print -quit || true)"
          if [ -z "$MAIN_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 2 -type f \( -name 'commute-traffic-monitor-github*.zip' -o -name 'commute-traffic-monitor*.zip' \) -print -quit || true)"
            if [ -z "$ZIP_FILE" ]; then
              echo "::error::No encuentro ni commute_monitor/__main__.py ni un ZIP commute-traffic-monitor*.zip."
              exit 1
            fi
            rm -rf .runtime_app
            mkdir -p .runtime_app
            unzip -q "$ZIP_FILE" -d .runtime_app
            MAIN_FILE="$(find .runtime_app -type f -path '*/commute_monitor/__main__.py' -print -quit || true)"
          fi
          if [ -z "$MAIN_FILE" ]; then
            echo "::error::No encuentro commute_monitor/__main__.py."
            exit 1
          fi
          PACKAGE_DIR="$(dirname "$MAIN_FILE")"
          APP_ROOT="$(dirname "$PACKAGE_DIR")"
          echo "APP_ROOT=$APP_ROOT" >> "$GITHUB_ENV"
          if [ -f "$GITHUB_WORKSPACE/state/reference_route.json" ]; then
            mkdir -p "$APP_ROOT/state"
            cp "$GITHUB_WORKSPACE/state/reference_route.json" "$APP_ROOT/state/reference_route.json"
          fi

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r "$APP_ROOT/requirements.txt"

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TOMTOM_API_KEY:-}" || { echo "::error::Falta TOMTOM_API_KEY"; exit 1; }
          test -n "${SMTP_PASSWORD:-}" || { echo "::error::Falta SMTP_PASSWORD"; exit 1; }

      - name: Regenerate fixed route with waypoint
        if: github.event_name == 'workflow_dispatch' && inputs.regenerate_route == true
        shell: bash
        run: |
          set -euo pipefail
          python tools/generate_reference_route_waypoint.py "$GITHUB_WORKSPACE/state/reference_route.json"
          mkdir -p "$APP_ROOT/state"
          cp "$GITHUB_WORKSPACE/state/reference_route.json" "$APP_ROOT/state/reference_route.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/reference_route.json
          if git diff --cached --quiet; then
            echo "La ruta no ha cambiado."
          else
            git commit -m "Update fixed commute route via waypoint"
            git push
          fi

      - name: Check fixed reference route
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$APP_ROOT/state/reference_route.json" ]; then
            echo "::error::Falta state/reference_route.json. Ejecuta manualmente con regenerate_route=true."
            exit 1
          fi

      - name: Manual test - measure now and send email
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode != 'morning'
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_ROOT"
          python -m commute_monitor --once --send

      - name: Morning monitor
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'morning')
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_ROOT"
          python -m commute_monitor

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: commute-traffic-${{ github.run_id }}
          path: |
            **/output/*.csv
            **/output/*.json
          if-no-files-found: ignore
          retention-days: 30
