name: Morning commute traffic monitor

on:
  schedule:
    - cron: "15 6 * * 1-5"
      timezone: "Europe/Madrid"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morning-commute-traffic
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      DRY_RUN: "false"
      TIMEZONE: "Europe/Madrid"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run commute monitor
        run: python -m commute_monitor

      - name: Upload daily measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: commute-traffic-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 30
